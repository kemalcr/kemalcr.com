---
layout: default
title: Kemal - Blog
---

<div class="Blog-header">
  <h1 class="Blog-title">Blog</h1>
  <p class="Blog-subtitle">Latest news, updates and articles about Kemal</p>
</div>

<div class="Blog-container">
  {% for post in site.posts %}
    <article class="Blog-card">
      <time class="Blog-card-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
      <h2 class="Blog-card-title">
        <a href="{{ post.url | prepend: site.baseurl }}" class="Blog-card-link">{{ post.title }}</a>
      </h2>
      {% if post.excerpt %}
        <p class="Blog-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      {% endif %}
    </article>
  {% endfor %}
</div>
