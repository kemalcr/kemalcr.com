---
layout: default
---
<article class="k-article k-post" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="k-article__header">
    <a href="{{ site.baseurl }}/blog/" class="k-back">← Blog</a>
    <h1 itemprop="name headline">{{ page.title }}</h1>
    <div class="k-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.author %}<span>· <span itemprop="author">{{ page.author }}</span></span>{% endif %}
    </div>
  </header>
  <div class="k-prose" itemprop="articleBody">
    {{ content }}
  </div>
  <footer class="k-post__footer">
    <a href="{{ site.baseurl }}/blog/" class="k-back">← Back to Blog</a>
  </footer>
</article>
